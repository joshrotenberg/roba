[package]
name = "roba-core"
version = "0.2.0"
edition = "2024"
authors = ["Josh Rotenberg <joshrotenberg@gmail.com>"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/joshrotenberg/roba"
homepage = "https://github.com/joshrotenberg/roba"
documentation = "https://docs.rs/roba-core"
readme = "README.md"
description = "Provider-neutral contracts and process-local lifecycle for one bounded Roba agent run."
keywords = ["roba", "agent", "claude", "codex", "engine"]
categories = ["api-bindings", "asynchronous"]

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
# Default features: the async runtime + json result types. The compatibility
# path awaits execute_json and the bounded provider consumes stream-json, so
# unlike roba-types this crate needs the async surface.
claude-wrapper = "0.14"
codex-wrapper = "0.3.1"
tokio = { version = "1", features = ["rt", "sync"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt", "sync", "time"] }
tempfile = "3"
