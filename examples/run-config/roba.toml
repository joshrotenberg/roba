# The small public config consumed by `roba run --config PATH`.
# Resolution order is defaults -> selected provider -> named agent -> CLI.

[defaults]
provider = "claude"
permissions = "read_only"
timeout_secs = 600

[providers.codex]
effort = "high"

[providers.claude]
max_cost_usd = 10.0

[agents.builder]
provider = "codex"
instructions = [
  "Own the requested change end to end.",
  "Use bounded Roba workers for independent work when useful.",
]
permissions = "workspace_write"
max_workers = 4
max_worker_depth = 2
