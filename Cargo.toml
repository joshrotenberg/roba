[package]
name = "roba"
version = "0.1.0"
edition = "2024"
rust-version = "1.90.0"
authors = ["Josh Rotenberg <joshrotenberg@gmail.com>"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/joshrotenberg/roba"
homepage = "https://github.com/joshrotenberg/roba"
documentation = "https://docs.rs/roba"
readme = "README.md"
build = "build.rs"
description = "Single-prompt CLI runner built on claude-wrapper"
keywords = ["claude", "cli", "ai", "llm", "anthropic"]
categories = ["command-line-utilities"]

[[bin]]
name = "roba"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
claude-wrapper = "0.10"
dialoguer = { version = "0.11", default-features = false, features = ["fuzzy-select"] }
glob = "0.3"
indicatif = "0.17"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
termimad = "0.33"
toml = "0.8"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
