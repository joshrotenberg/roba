[package]
name = "roba"
version = "0.11.0"
edition = "2024"
# No rust-version floor: roba is a binary (nobody depends on it as a
# library), so it tracks recent stable rather than carrying an MSRV.
# `cargo install` from source needs a current toolchain; brew/release
# binaries are unaffected.
authors = ["Josh Rotenberg <joshrotenberg@gmail.com>"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/joshrotenberg/roba"
homepage = "https://github.com/joshrotenberg/roba"
documentation = "https://docs.rs/roba"
readme = "README.md"
description = "A library-first bounded agent run with Claude and Codex adapters, plus thin CLI, REPL, and MCP surfaces."
keywords = ["agent", "claude", "codex", "cli", "llm"]
categories = ["command-line-utilities"]

# Root package + workspace: `roba` stays at the repo root; `roba-types` (the
# published, dependency-light machine contract) and `roba-core` (the clap-free
# run engine) are members. resolver "3" matches the edition-2024 package
# default so making this a workspace does not change dependency resolution.
[workspace]
members = ["roba-types", "roba-core", "roba-mcp", "roba-repl"]
resolver = "3"

[[bin]]
name = "roba"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
claude-wrapper = "0.13"
dialoguer = { version = "0.12", default-features = false, features = ["fuzzy-select"] }
glob = "0.3"
indicatif = "0.18"
# The clap-free run engine (Config -> QueryResult), split out of the CLI so a
# programmatic caller / serve (#142) can drive it without clap.
roba-core = { version = "0.2.0", path = "roba-core" }
roba-mcp = { version = "0.1.0", path = "roba-mcp" }
roba-repl = { version = "0.1.0", path = "roba-repl" }
# The machine contract (envelopes + exit codes), shared so the binary and the
# published crate cannot disagree. version + path so `roba` can still publish.
roba-types = { version = "0.1.1", path = "roba-types" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
termimad = "0.34"
toml = "1"
tokio = { version = "1", features = ["io-std", "io-util", "macros", "rt-multi-thread"] }
# v4 UUID minting for `--detach` (client-side session handle). Minimal
# features: just the v4 generator, no serde / no formatting extras.
uuid = { version = "1", default-features = false, features = ["v4"] }

# Unix-only: `--detach` classifies this process's stdin (fstat/poll/read) to
# block input that the detached child -- whose stdin is /dev/null -- would
# silently lose. See `stdin_would_lose_data` in src/detach.rs.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
