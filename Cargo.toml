[package]
name = "roba"
version.workspace = true
edition = "2024"
# No rust-version floor: roba is a binary (nobody depends on it as a
# library), so it tracks recent stable rather than carrying an MSRV.
# `cargo install` from source needs a current toolchain; brew/release
# binaries are unaffected.
authors = ["Josh Rotenberg <joshrotenberg@gmail.com>"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/joshrotenberg/roba"
homepage = "https://github.com/joshrotenberg/roba"
documentation = "https://docs.rs/roba"
readme = "README.md"
description = "An MCP-native harness for one logical Claude or Codex agent."
keywords = ["agent", "claude", "codex", "cli", "llm"]
categories = ["command-line-utilities"]

# Root package + workspace: `roba` stays at the repo root; `roba-types` (the
# published, dependency-light machine contract), `roba-core` (the clap-free
# run engine), `roba-context` (the data-oriented managed-context catalog),
# `roba-mcp` (the MCP-native single-agent host), and `roba-git` (the optional
# Git workspace service) are members.
# resolver "3" matches the edition-2024 package default so making this a
# workspace does not change dependency resolution.
[workspace]
members = [
    "crates/roba-types",
    "crates/roba-core",
    "crates/roba-context",
    "crates/roba-mcp",
    "crates/roba-git",
]
resolver = "3"

[workspace.package]
version = "0.12.0"

# Roba's public crates ship as one compatible release set. Keeping the
# versions and path-plus-registry dependency requirements here prevents a
# package from resolving against an older internal API during publication.
[workspace.dependencies]
roba-core = { version = "0.12.0", path = "crates/roba-core" }
roba-context = { version = "0.12.0", path = "crates/roba-context" }
roba-git = { version = "0.12.0", path = "crates/roba-git" }
roba-mcp = { version = "0.12.0", path = "crates/roba-mcp" }
roba-types = { version = "0.12.0", path = "crates/roba-types" }

[[bin]]
name = "roba"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
# Provider-neutral finite-run core.
roba-core.workspace = true
# Managed agent, skill, and prompt catalog resolved by startup configuration.
roba-context.workspace = true
# Optional Layer-3 Git workspace service selected explicitly by `--git`.
roba-git.workspace = true
# The typed single-agent MCP contract used by the provider-neutral CLI.
roba-mcp.workspace = true
# The machine contract (envelopes + exit codes), shared so the binary and the
# published crate cannot disagree. version + path so `roba` can still publish.
roba-types.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
toml = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal"] }

[dev-dependencies]
assert_cmd = "2"
predicates = "3"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
