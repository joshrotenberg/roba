# release-plz configuration
# https://release-plz.dev/docs/config
#
# Single-crate release using git-cliff for changelog generation.
# Conventional commits drive both the version bump (release-plz) and
# the changelog entries (git-cliff via cliff.toml).

[workspace]
pr_labels = ["release"]
changelog_config = "cliff.toml"
# Trigger a release when feat/fix/perf/refactor land. docs/chore/test/ci
# alone do not cut a new version.
release_commits = "^(feat|fix|perf|refactor)"

[[package]]
name = "roba"
semver_check = true
release = true
publish = true
# release-plz creates the git tag only; cargo-dist owns the GitHub
# release. The tag push (via COMMITTER_TOKEN, a PAT) triggers
# .github/workflows/release.yml, which builds the cross-platform
# binaries and runs `gh release create` with the artifacts attached.
# If release-plz also created the release, dist's `gh release create`
# for the same tag would collide.
git_release_enable = false
git_tag_enable = true
git_tag_name = "v{{ version }}"
changelog_update = true
changelog_path = "CHANGELOG.md"
