# release-plz configuration
# https://release-plz.dev/docs/config
#
# Single-crate release using git-cliff for changelog generation.
# Conventional commits drive both the version bump (release-plz) and
# the changelog entries (git-cliff via cliff.toml).

[workspace]
pr_labels = ["release"]
changelog_config = "cliff.toml"
# Trigger a release when feat/fix/perf/refactor land. docs/chore/test/ci
# alone do not cut a new version.
release_commits = "^(feat|fix|perf|refactor)"

[[package]]
name = "roba"
semver_check = true
release = true
publish = true
# release-plz creates the tag AND the GitHub release (with the
# git-cliff changelog as the body). The tag push (via COMMITTER_TOKEN,
# a PAT) triggers .github/workflows/release.yml, which builds the
# cross-platform binaries and *uploads* them to that release via an
# upsert step (gh release upload --clobber if it exists, else create).
# This matches the proven adrs setup. See the "Create or Update GitHub
# Release" step in release.yml.
git_release_enable = true
git_tag_enable = true
git_tag_name = "v{{ version }}"
changelog_update = true
changelog_path = "CHANGELOG.md"

# The dependency-light contract crate. Publishes to crates.io (so downstream
# harnesses can depend on it) but does NOT get its own git tag or GitHub
# release: the `v{{ version }}` tag + release + cross-platform binaries belong
# to the `roba` binary. release-plz publishes members in dependency order
# (roba-types before roba); its released version is tracked via crates.io.
[[package]]
name = "roba-types"
semver_check = true
release = true
publish = true
git_release_enable = false
git_tag_enable = false
changelog_update = true
changelog_path = "roba-types/CHANGELOG.md"

# The clap-free compatibility engine and provider-neutral finite-run core.
# Publishes to crates.io so the `roba` binary's path dep resolves on publish;
# no git tag or GitHub release of its own (those belong to the `roba` binary).
# release-plz publishes in dependency order (roba-core before roba).
[[package]]
name = "roba-core"
semver_check = true
release = true
publish = true
git_release_enable = false
git_tag_enable = false
changelog_update = true
changelog_path = "roba-core/CHANGELOG.md"
