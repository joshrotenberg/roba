# release-plz configuration
# https://release-plz.dev/docs/config
#
# Workspace release using git-cliff for changelog generation.
# Conventional commits drive both the version bump (release-plz) and
# the changelog entries (git-cliff via cliff.toml).

[workspace]
pr_labels = ["release"]
changelog_config = "cliff.toml"
# Trigger a release when feat/fix/perf/refactor land. docs/chore/test/ci
# alone do not cut a new version.
release_commits = "^(feat|fix|perf|refactor)"

[[package]]
name = "roba"
version_group = "roba"
semver_check = true
release = true
publish = true
# release-plz creates the tag AND the GitHub release (with the
# git-cliff changelog as the body). The tag push (via COMMITTER_TOKEN,
# a PAT) triggers .github/workflows/release.yml, which builds the
# cross-platform binaries and *uploads* them to that release via an
# upsert step (gh release upload --clobber if it exists, else create).
# This matches the proven adrs setup. See the "Create or Update GitHub
# Release" step in release.yml.
git_release_enable = true
git_tag_enable = true
git_tag_name = "v{{ version }}"
changelog_update = true
changelog_path = "CHANGELOG.md"

# The dependency-light contract crate. Publishes to crates.io (so downstream
# harnesses can depend on it) but does NOT get its own git tag or GitHub
# release: the `v{{ version }}` tag + release + cross-platform binaries belong
# to the `roba` binary. release-plz publishes the synchronized release set in
# dependency order; its released version is tracked via crates.io.
[[package]]
name = "roba-types"
version_group = "roba"
semver_check = true
release = true
publish = true
git_release_enable = false
git_tag_enable = false
changelog_update = false

# The clap-free provider-neutral finite-run core and provider adapters.
# Publishes to crates.io so the `roba` binary's path dep resolves on publish;
# no git tag or GitHub release of its own (those belong to the `roba` binary).
# release-plz publishes it before roba-mcp, roba-git, and the root binary.
[[package]]
name = "roba-core"
version_group = "roba"
semver_check = true
release = true
publish = true
git_release_enable = false
git_tag_enable = false
changelog_update = false

# The data-only managed-context catalog. It currently has no internal Roba
# dependencies and publishes before the application-layer crates that will
# consume it. The root release owns the git tag and GitHub release.
[[package]]
name = "roba-context"
version_group = "roba"
semver_check = true
release = true
publish = true
git_release_enable = false
git_tag_enable = false
changelog_update = false

# The MCP-native hot single-agent host. It depends on roba-core and must be
# published before roba-git and the root binary. The root release owns the git
# tag and GitHub release.
[[package]]
name = "roba-mcp"
version_group = "roba"
semver_check = true
release = true
publish = true
git_release_enable = false
git_tag_enable = false
changelog_update = false

# The optional typed Git extension. It depends on roba-mcp and must be
# published before the root binary. The root release owns the git tag and
# GitHub release.
[[package]]
name = "roba-git"
version_group = "roba"
semver_check = true
release = true
publish = true
git_release_enable = false
git_tag_enable = false
changelog_update = false
