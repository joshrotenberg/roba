# Keep the CI policy deterministic. The workflow pins mdbook-lint 0.15.2.
fail-on-warnings = true

# These rules catch mechanical Markdown defects without enforcing prose style.
enabled-rules = [
    "MD001",
    "MD003",
    "MD004",
    "MD005",
    "MD007",
    "MD009",
    "MD010",
    "MD011",
    "MD012",
    "MD018",
    "MD019",
    "MD020",
    "MD021",
    "MD022",
    "MD023",
    "MD024",
    "MD025",
    "MD026",
    "MD027",
    "MD028",
    "MD029",
    "MD030",
    "MD031",
    "MD032",
    "MD035",
    "MD037",
    "MD038",
    "MD039",
    "MD040",
    "MD041",
    "MD042",
    "MD045",
    "MD046",
    "MD047",
    "MD048",
    "MD049",
    "MD050",
    "MD051",
    "MD052",
    "MD053",
    "MD054",
    "MD055",
    "MD056",
    "MD058",
    "MD060",
    "MDBOOK002",
]

ignore-paths = [
    # release-plz/git-cliff own these generated files.
    "CHANGELOG.md",
    "**/CHANGELOG.md",
    # Claude interprets this provider import shim rather than rendering it.
    "CLAUDE.md",
    # Local build output must never become part of the documentation corpus.
    "target/**",
]
