[package]
name = "roba-git"
version.workspace = true
edition = "2024"
authors = ["Josh Rotenberg <joshrotenberg@gmail.com>"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/joshrotenberg/roba"
homepage = "https://github.com/joshrotenberg/roba"
description = "A typed Git workspace service for the MCP-native Roba harness."
keywords = ["agent", "mcp", "git", "roba"]
categories = ["development-tools"]

[dependencies]
git-spawn = "0.3"
roba-mcp.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["sync", "time"] }
tower-mcp = { version = "0.22", default-features = false, features = ["protocol-2026-07-28"] }

[dev-dependencies]
bytes = "1"
http-body-util = "0.1"
hyper = { version = "1", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["client-legacy", "http1", "tokio"] }
roba-core.workspace = true
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }
