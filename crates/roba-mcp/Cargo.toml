[package]
name = "roba-mcp"
version.workspace = true
edition = "2024"
authors = ["Josh Rotenberg <joshrotenberg@gmail.com>"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/joshrotenberg/roba"
homepage = "https://github.com/joshrotenberg/roba"
description = "MCP-native host for one logical Roba agent."
keywords = ["agent", "mcp", "claude", "codex", "llm"]
categories = ["development-tools"]

[dependencies]
axum = "0.8"
roba-core.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
tokio = { version = "1", features = ["io-std", "io-util", "macros", "net", "rt", "sync", "time"] }
tower-mcp = { version = "0.22", default-features = false, features = ["http", "protocol-2026-07-28"] }
uuid = { version = "1", default-features = false, features = ["v4"] }

[dev-dependencies]
bytes = "1"
http-body-util = "0.1"
hyper = { version = "1", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["client-legacy", "http1", "tokio"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "test-util", "time"] }
