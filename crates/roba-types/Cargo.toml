[package]
name = "roba-types"
version.workspace = true
edition = "2024"
authors = ["Josh Rotenberg <joshrotenberg@gmail.com>"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/joshrotenberg/roba"
homepage = "https://github.com/joshrotenberg/roba"
documentation = "https://docs.rs/roba-types"
readme = "README.md"
description = "roba's machine contract: provider-neutral JSON envelopes and exit codes."
keywords = ["roba", "agent", "cli", "json", "envelope"]
categories = ["command-line-utilities", "api-bindings"]

[dependencies]
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
serde_json = "1"
