# Roba's own provider-neutral startup configuration.
#
# This file is intentionally conservative: inspection works by default, while
# implementation requires an explicit `--writable` or `--full-auto` override.
# Inspect the resolved values and provenance with:
#
#   roba config effective
#
# Start a finite worker or a hot MCP agent with:
#
#   roba run --writable --git "implement issue #..."
#   mcp-repl -- roba serve --writable --git

version = 1

[agent]
provider = "codex"
effort = "high"
instructions = [
  "Read AGENTS.md and the relevant current documentation before modifying this repository.",
  "Work in small reviewable steps and use the repository's required validation commands as the acceptance boundary.",
  "Preserve Roba's provider-neutral single-agent boundaries, explicit authority, typed evidence, and byte-clean stdout contracts.",
]

[execution]
permissions = "read_only"
timeout_secs = 1800

[context]
project = [
  "Roba is an MCP-native harness for one logical Claude or Codex agent, built on a finite provider-neutral core.",
  "The checked-in source, tests, AGENTS.md, and docs/architecture describe the current contract; historical designs live only in Git history.",
]

[extensions.git]
enabled = true
