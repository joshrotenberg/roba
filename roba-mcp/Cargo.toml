[package]
name = "roba-mcp"
version = "0.1.0"
edition = "2024"
authors = ["Josh Rotenberg <joshrotenberg@gmail.com>"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/joshrotenberg/roba"
homepage = "https://github.com/joshrotenberg/roba"
description = "MCP-native host for one logical Roba agent."
keywords = ["agent", "mcp", "claude", "codex", "llm"]
categories = ["development-tools"]

[dependencies]
roba-core = { version = "0.2.0", path = "../roba-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt", "sync"] }
tower-mcp = { version = "0.22", default-features = false }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }
