name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  test:
    name: Test (${{ matrix.os }}, ${{ matrix.rust }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # macos-latest (macOS 15). Previously pinned to macos-14
        # because the macos-15 image shipped a broken `rustup` (the
        # `rustup-init` stub intercepted `cargo clippy` and exited 1);
        # verified fixed upstream and un-pinned (#274).
        os: [ubuntu-latest, macos-latest, windows-latest]
        rust: [stable, beta]
        exclude:
          - os: macos-latest
            rust: beta
          - os: windows-latest
            rust: beta
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}
          components: rustfmt, clippy

      - uses: swatinem/rust-cache@v2
        with:
          shared-key: "${{ matrix.os }}-${{ matrix.rust }}"

      - name: Check formatting
        if: matrix.rust == 'stable' && matrix.os == 'ubuntu-latest'
        run: cargo fmt --all -- --check

      - name: Clippy
        if: matrix.rust == 'stable'
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Build
        run: cargo build --workspace --all-features

      - name: Unit tests
        run: cargo test --workspace --lib --all-features

      - name: Mechanical CLI tests
        run: cargo test --test cli --all-features

      - name: Doc tests
        run: cargo test --workspace --doc --all-features

  docs:
    name: Documentation
    runs-on: ubuntu-latest
    env:
      RUSTDOCFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          shared-key: "docs"

      - name: Build docs
        run: cargo doc --workspace --no-deps --all-features

  # Release-time gate (#405): re-verify the bundled rates.toml freshness ONLY
  # on the release-plz PR, so it never adds standing red to `main` as the
  # table ages between releases (the noise #208 was closed to avoid). A stale
  # table fails the release PR, forcing a manual re-verify before release.
  rates-freshness:
    name: Rates freshness (release PR)
    if: github.event_name == 'pull_request' && startsWith(github.head_ref, 'release-plz-')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          shared-key: "rates-freshness"

      - name: Re-verify bundled rates.toml freshness
        run: cargo test --lib rates_fresh_for_release -- --ignored
