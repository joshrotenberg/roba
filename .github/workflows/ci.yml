name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  changes:
    name: Classify changes
    runs-on: ubuntu-latest
    outputs:
      docs_only: ${{ steps.classify.outputs.docs_only }}
      markdown_changed: ${{ steps.classify.outputs.markdown_changed }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Test change classifier
        run: .github/scripts/test-classify-changes.sh

      - name: Classify changed paths
        id: classify
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if [[ "$EVENT_NAME" == "workflow_dispatch" || -z "$BASE_SHA" || \
                "$BASE_SHA" == "0000000000000000000000000000000000000000" ]]; then
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
            echo "markdown_changed=true" >> "$GITHUB_OUTPUT"
          else
            git diff --name-only -z "$BASE_SHA" "$HEAD_SHA" \
              | .github/scripts/classify-changes.sh >> "$GITHUB_OUTPUT"
          fi

  markdown:
    name: Markdown
    needs: changes
    if: needs.changes.outputs.markdown_changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install mdbook-lint 0.15.2
        env:
          MDBOOK_LINT_SHA256: 08a252e749d90f19493c24207fc2edfca168057c4bb66ee196b61a5836bc2e06
        run: |
          archive="$RUNNER_TEMP/mdbook-lint.tar.xz"
          curl --fail --location --silent --show-error \
            https://github.com/joshrotenberg/mdbook-lint/releases/download/v0.15.2/mdbook-lint-x86_64-unknown-linux-gnu.tar.xz \
            --output "$archive"
          echo "$MDBOOK_LINT_SHA256  $archive" | sha256sum --check
          tar -xJf "$archive" -C "$RUNNER_TEMP" --strip-components=1 \
            mdbook-lint-x86_64-unknown-linux-gnu/mdbook-lint
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - name: Lint tracked Markdown
        run: |
          mdbook-lint --version
          git ls-files -z '*.md' | xargs -0 mdbook-lint lint \
            --config .mdbook-lint.toml --fail-on-warnings --output github

  test:
    name: Test (${{ matrix.os }}, ${{ matrix.rust }})
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # macos-latest (macOS 15). Previously pinned to macos-14
        # because the macos-15 image shipped a broken `rustup` (the
        # `rustup-init` stub intercepted `cargo clippy` and exited 1);
        # verified fixed upstream and un-pinned (#274).
        os: [ubuntu-latest, macos-latest, windows-latest]
        rust: [stable, beta]
        exclude:
          - os: macos-latest
            rust: beta
          - os: windows-latest
            rust: beta
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}
          components: rustfmt, clippy

      - uses: swatinem/rust-cache@v2
        with:
          shared-key: "${{ matrix.os }}-${{ matrix.rust }}"

      - name: Check formatting
        if: matrix.rust == 'stable' && matrix.os == 'ubuntu-latest'
        run: cargo fmt --all -- --check

      - name: Clippy
        if: matrix.rust == 'stable'
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Build
        run: cargo build --workspace --all-features

      - name: Unit tests
        run: cargo test --workspace --lib --all-features

      - name: Mechanical CLI tests
        run: cargo test --test cli --all-features

      - name: Doc tests
        run: cargo test --workspace --doc --all-features

  docs:
    name: Documentation
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    env:
      RUSTDOCFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          shared-key: "docs"

      - name: Build docs
        run: cargo doc --workspace --no-deps --all-features

  # Release-time gate (#405): re-verify the bundled rates.toml freshness ONLY
  # on the release-plz PR, so it never adds standing red to `main` as the
  # table ages between releases (the noise #208 was closed to avoid). A stale
  # table fails the release PR, forcing a manual re-verify before release.
  rates-freshness:
    name: Rates freshness (release PR)
    if: github.event_name == 'pull_request' && startsWith(github.head_ref, 'release-plz-')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          shared-key: "rates-freshness"

      - name: Re-verify bundled rates.toml freshness
        run: cargo test --lib rates_fresh_for_release -- --ignored
