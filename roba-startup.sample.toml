# Provider-neutral startup configuration for `roba run` and `roba serve`.
# The version marker makes schema selection explicit and fail-closed.
version = 1

[agent]
provider = "codex"
# model = "provider-model-id"
effort = "high"
instructions = [
  "Work in small, reviewable steps.",
  "Treat tests as the acceptance boundary.",
]

[execution]
permissions = "read_only" # read_only | workspace_write | full_auto
# max_turns = 20           # Claude only
# max_cost_usd = 5.0       # Claude only
timeout_secs = 900

[context]
# ambient preserves provider-native discovery; controlled applies the selected
# adapter's tested reduction. Hermetic currently fails for both built-ins.
ambient_policy = "controlled" # ambient | controlled | hermetic
project = ["This repository's public API is its compatibility boundary."]
# run = ["Context added to every operation admitted by this host."]
# Selecting managed context is optional. With no agent selection, provider
# managed selection remains empty even though built-in catalog metadata is available.
agent = "roba.repo-worker"
skills = []
prompts = ["roba.issue-worker"]

[context.builtins]
enabled = true
# disable = ["roba.issue-worker"]

# Project definitions use exactly one bounded inline body or a Markdown path
# relative to this file. Bodies never appear in `roba config effective`.
# [[context.definitions]]
# kind = "skill"
# id = "local.project-conventions"
# description = "Repository-specific engineering conventions."
# path = ".roba/skills/project-conventions.md"

[extensions.git]
enabled = true
# Set to 0 to keep admission/final snapshots but disable active polling.
progress_interval_secs = 5
